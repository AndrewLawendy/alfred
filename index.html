  <body>
    <script>
      // Dark or light before the app loads, from the Appearance setting
      // (utils/appearance.ts), so a dark phone never flashes the light page
      (function () {
        try {
          var saved = localStorage.getItem("alfred-appearance");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.body.classList.add(
            dark ? "chakra-ui-dark" : "chakra-ui-light"
          );
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (dark)
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#15171C");
        } catch (e) {}
      })();
    </script>
